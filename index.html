<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="기숙사 볼링 - 마우스, 손가락, 웹캠 손동작으로 즐기는 10프레임 3D 볼링 게임">
<meta name="theme-color" content="#a8d3ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2327b5f2'/%3E%3Ccircle cx='24' cy='22' r='4' fill='%230d2238'/%3E%3Ccircle cx='35' cy='19' r='4' fill='%230d2238'/%3E%3Ccircle cx='31' cy='30' r='4' fill='%230d2238'/%3E%3C/svg%3E">
<style>:root{color-scheme:light}html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>기숙사 볼링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed 3D lane with white rounded HUD panels on top, like a console sports game. */
:root {
  --ink: #0d2238;
  --ink-soft: #4b6379;
  --paper: #ffffff;
  --panel: rgba(255, 255, 255, 0.95);
  --sky: #27b5f2;
  --sky-deep: #0b86c4;
  --coral: #ff6a3d;
  --sun: #ffc93c;
  --mint: #2fbf86;
  --line: #d6e4ee;
  --shadow: 0 8px 26px rgba(13, 34, 56, 0.24);
  --font-ui: 'Jua', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #a8d3ea;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#gl, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fx { pointer-events: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.panel { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); }
.chip {
  background: var(--panel); border: 0; border-radius: 999px; padding: 8px 16px; font-size: 15px;
  box-shadow: var(--shadow); color: var(--ink); white-space: nowrap; flex: none;
}
.chip:active { transform: translateY(1px); }

/* top bar */
#topbar {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; gap: 10px; align-items: center;
  justify-content: space-between; pointer-events: none;
}
#topbar > button { pointer-events: auto; }
#turn { display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; font-size: 17px; min-width: 0; flex: 0 1 auto; }
#turn i { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
#turn b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 7em; }
#turn span { color: var(--ink-soft); font-size: 14px; white-space: nowrap; }
#turn em { font-style: normal; background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 14px; }

/* scoreboard */
#board {
  position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: min(720px, calc(100% - 32px)); padding: 12px 12px 10px; overflow-x: auto;
}
#board table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 600px; font-size: 14px; }
#board th, #board td { padding: 0; text-align: center; font-weight: 400; }
#board thead th { color: var(--ink-soft); padding-bottom: 4px; font-size: 13px; }
#board .who { text-align: left; padding-right: 8px; white-space: nowrap; width: 1%; }
#board .who i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
#board tbody tr > * { border-top: 1px solid var(--line); }
#board tbody tr:first-child > * { border-top: 0; }
#board tr.cur .who { color: var(--sky-deep); }
.fr { display: grid; grid-template-columns: repeat(2, 1fr); border-left: 1px solid var(--line); }
.fr.ten { grid-template-columns: repeat(3, 1fr); }
.fr .m { height: 20px; line-height: 20px; font-size: 13px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.fr .m:last-child { border-right: 0; }
.fr .c { grid-column: 1 / -1; height: 26px; line-height: 26px; font-size: 16px; font-variant-numeric: tabular-nums; }
td.on .fr { background: #e8f6fe; }
.fr .m.x { color: var(--coral); }
.tot { width: 52px; font-size: 18px; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line); }

/* banner */
#banner {
  position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none;
  font-size: clamp(44px, 11vw, 120px); line-height: 1.05; color: #fff; letter-spacing: 0.02em;
  -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 rgba(13,34,56,.35);
  opacity: 0; transform: scale(.4);
}
#banner.show { animation: pop 1.7s cubic-bezier(.2,1.4,.4,1) forwards; }
#banner.strike { color: var(--sun); }
#banner.spare { color: #7ee0ff; }
#banner.miss { color: #d8e3ec; }
#banner small { display: block; font-size: .32em; -webkit-text-stroke: 4px var(--ink); margin-top: 4px; }
@keyframes pop { 0% { opacity: 0; transform: scale(.3) rotate(-6deg); } 18% { opacity: 1; transform: scale(1.12) rotate(2deg); }
  30% { transform: scale(1) rotate(0); } 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
#toast {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%); padding: 10px 22px; font-size: 22px; opacity: 0;
  pointer-events: none; width: max-content; max-width: min(520px, calc(100% - 32px)); text-align: center; line-height: 1.35; transition: opacity .25s;
}
#toast.show { opacity: 1; }
#speedTag {
  position: absolute; left: 50%; bottom: 36%; transform: translateX(-50%); padding: 6px 16px; font-size: 22px; opacity: 0;
  transition: opacity .3s; pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap;
}
#speedTag.show { opacity: 1; }

/* bottom dock */
#dock {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
}
#dock > * { pointer-events: none; }
#pad { pointer-events: auto; }
#opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
#opts > .panel { pointer-events: auto; }
#spinBox { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 14px; font-size: 15px; }
#spinBox[hidden], #modeBox[hidden] { display: none; }
#spinBox .wt { color: var(--ink-soft); font-size: 13px; }
#spinBox button { border: 0; width: 34px; height: 34px; border-radius: 11px; background: #e9f4fb; font-size: 14px; padding: 0; }
#spinBox button:active { background: #cfe9f7; }
#spinBox input[type=range] { width: clamp(110px, 22vw, 170px); accent-color: var(--sky); height: 28px; margin: 0; }
#spinBox b { font-weight: 400; min-width: 4.8em; text-align: center; font-size: 15px; }
#modeBox { padding: 4px; }
#modeBox button { border: 0; border-radius: 12px; background: #e9f4fb; padding: 9px 12px; font-size: 14px; }
#modeBox button:active { background: #cfe9f7; }
#camBox { position: absolute; left: 16px; top: calc(64px + env(safe-area-inset-top, 0px)); width: 204px; padding: 8px 8px 6px; z-index: 5; }
#camBox[hidden] { display: none; }
#camBox .camHead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.3; margin-bottom: 6px; }
#camBox .camHead button { border: 0; width: 26px; height: 26px; border-radius: 9px; background: #e9f4fb; padding: 0; flex: none; }
#camBox .camView { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #0d2238; }
#camBox video, #camBox canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#camPow { height: 10px; margin-top: 6px; border-radius: 999px; background: #e3edf4; overflow: hidden; }
#camPow i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2fbf86, #ffc93c, #ff6a3d); }
#camBox small { display: block; margin-top: 5px; color: var(--ink-soft); font-size: 11px; }
#btnCam[aria-pressed="true"] { background: var(--sky); color: #fff; }
#wbox { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; font-size: 15px; pointer-events: auto; }
#wbox[hidden] { display: none; }
#wbox .wt { color: var(--ink-soft); font-size: 13px; }
#wbox b { font-weight: 400; font-size: 20px; min-width: 3.1em; text-align: center; font-variant-numeric: tabular-nums; }
#wbox small { color: var(--ink-soft); font-size: 12px; margin-left: 2px; margin-right: 6px; }
#wbox button { border: 0; width: 38px; height: 38px; border-radius: 12px; background: #e9f4fb; font-size: 22px; line-height: 1; padding: 0; }
#wbox button:active { background: #cfe9f7; }
#wbox button:disabled { opacity: .35; cursor: default; }
#hint { padding: 10px 20px; font-size: 17px; text-align: center; max-width: min(640px, 100%); line-height: 1.35; }
#hint b { font-weight: 400; color: var(--sky-deep); }
#pad { display: flex; gap: 10px; align-items: stretch; }
#pad button {
  border: 0; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); font-size: 22px; min-width: 64px; height: 54px;
  padding: 0 18px; touch-action: none;
}
#pad button:active, #pad button.down { background: #dff3fd; transform: translateY(2px); }
#pad #btnOk { background: var(--sky); color: #fff; min-width: 120px; font-size: 20px; box-shadow: 0 5px 0 var(--sky-deep), var(--shadow); }
#pad #btnOk:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sky-deep); }
#pad #btnBack { font-size: 16px; }
#swingGuide { display: none; position: relative; width: 74px; height: 96px; }
#swingGuide.on { display: block; }
#swingGuide .tr { position: absolute; left: 36px; top: 6px; width: 4px; height: 84px; border-radius: 4px; background: rgba(255,255,255,.7); }
#swingGuide .bl {
  position: absolute; left: 22px; top: 10px; width: 32px; height: 32px; border-radius: 50%; background: var(--sky);
  border: 4px solid #fff; box-shadow: var(--shadow); animation: swingdemo 1.7s ease-in-out infinite;
}
@keyframes swingdemo { 0% { transform: translateY(0); opacity: 1; } 42% { transform: translateY(46px); opacity: 1; } 60% { transform: translateY(46px); opacity: 1; } 84% { transform: translateY(-58px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
#meter { width: min(300px, 70vw); height: 22px; border-radius: 999px; background: rgba(255,255,255,.75); overflow: hidden; display: none; box-shadow: var(--shadow); }
#meter.on { display: block; }
#meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--sun), var(--coral)); }
#spin { width: min(240px, 60vw); height: 14px; border-radius: 999px; background: rgba(255,255,255,.7); position: relative; display: none; box-shadow: var(--shadow); }
#spin.on { display: block; }
#spin::before { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink-soft); opacity: .5; }
#spin i { position: absolute; top: -4px; width: 22px; height: 22px; left: calc(50% - 11px); border-radius: 50%; background: var(--coral); border: 3px solid #fff; }
#spinLbl { font-size: 13px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); display: none; }
#spinLbl.on { display: block; }

/* overlays */
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: linear-gradient(180deg, rgba(8, 40, 70, .38), rgba(8, 40, 70, .55)); overflow-y: auto;
}
.overlay[hidden] { display: none; }
.card { width: min(560px, 100%); padding: 28px clamp(18px, 4vw, 36px) 26px; margin: auto; }
.card h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); font-weight: 400; line-height: 1; letter-spacing: .01em; }
.card h1 span { color: var(--sky); }
.card .sub { margin: 10px 0 22px; color: var(--ink-soft); font-size: 17px; }
.lbl { font-size: 14px; color: var(--ink-soft); margin: 0 0 8px; }
.seg { display: flex; gap: 8px; margin-bottom: 14px; }
.seg button {
  flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 14px; font-size: 20px; padding: 10px 0;
}
.seg button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #fff; box-shadow: 0 4px 0 var(--sky-deep); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.names label { display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; background: #fff; min-width: 0; }
.names i { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.names input { border: 0; font: inherit; font-size: 16px; width: 100%; min-width: 0; background: transparent; color: var(--ink); }
.names input:focus { outline: none; }
.names label:focus-within { border-color: var(--sky); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
.steps li { background: #eef7fc; border-radius: 14px; padding: 10px 8px; text-align: center; font-size: 14px; line-height: 1.35; color: var(--ink-soft); }
.steps li b { display: block; font-weight: 400; font-size: 17px; color: var(--ink); margin-bottom: 2px; }
.go {
  width: 100%; border: 0; border-radius: 18px; padding: 15px 0; font-size: 26px; background: var(--coral); color: #fff;
  box-shadow: 0 6px 0 #c24520; letter-spacing: .04em;
}
.go:active { transform: translateY(5px); box-shadow: 0 1px 0 #c24520; }
.best { margin: 14px 0 0; text-align: center; color: var(--ink-soft); font-size: 14px; min-height: 1.3em; }
#overBoard { margin: 14px 0 16px; overflow-x: auto; }
#overBoard table { width: 100%; border-collapse: collapse; font-size: 18px; }
#overBoard td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
#overBoard td:last-child { text-align: right; font-size: 24px; font-variant-numeric: tabular-nums; }
#overBoard tr.win td { color: var(--coral); }
#overBoard i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
.row2 { display: flex; gap: 10px; }
.row2 .go { font-size: 21px; }
.row2 .go.alt { background: #fff; color: var(--ink); box-shadow: 0 6px 0 var(--line); border: 2px solid var(--line); }
#noGL { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 20px; }
@media (max-width: 520px) {
  #hint { font-size: 15px; padding: 8px 14px; }
  #wbox small { display: none; }
  #wbox { padding-left: 12px; }
  #wbox .wt { display: none; }
  #modeBox { order: 1; }
  #spinBox { order: 2; flex: 1 1 100%; justify-content: center; padding-left: 10px; gap: 4px; }
  #spinBox .wt { display: none; }
  #spinBox b { min-width: 3.6em; font-size: 14px; }
  #speedTag { font-size: 17px; }
  #toast { font-size: 18px; }
  #pad button { height: 50px; min-width: 56px; }
  #pad #btnOk { min-width: 100px; }
  #turn { font-size: 14px; padding: 6px 10px 6px 8px; gap: 6px; }
  #turn i { width: 20px; height: 20px; }
  #turn span { font-size: 12px; }
  #turn em { font-size: 12px; padding: 2px 8px; }
  .chip { padding: 8px 11px; font-size: 13px; }
  #board { top: calc(60px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  #banner.show { animation-duration: 2.2s; }
  #swingGuide .bl { animation: none; }
}
</style>

<main id="app">
  <canvas id="gl" aria-label="볼링 레인 3D 화면"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header id="topbar">
    <button id="btnBoard" class="chip" type="button">점수판</button>
    <div id="turn" class="panel" hidden><i id="turnDot"></i><b id="turnName"></b><span id="turnInfo"></span><em id="turnTotal"></em></div>
    <button id="btnCam" class="chip" type="button" aria-pressed="false" title="웹캠으로 손동작을 인식해요">손 인식</button>
    <button id="btnSound" class="chip" type="button" aria-pressed="true">소리 켬</button>
  </header>

  <section id="board" class="panel" hidden aria-label="점수판"><table id="boardTable"></table></section>

  <div id="camBox" class="panel" hidden>
    <div class="camHead"><span id="camStatus">카메라 준비 중…</span><button id="camClose" type="button" aria-label="손 인식 끄기">✕</button></div>
    <div class="camView"><video id="camVideo" playsinline muted></video><canvas id="camMark" width="192" height="144"></canvas></div>
    <div id="camPow" aria-hidden="true"><i id="camPowFill"></i></div>
    <small>영상은 이 PC 안에서만 처리돼요</small>
  </div>
  <div id="banner" role="status"></div>
  <div id="toast" class="panel" role="status"></div>
  <div id="speedTag" class="panel"></div>

  <footer id="dock">
    <div id="swingGuide" aria-hidden="true"><div class="tr"></div><div class="bl"></div></div>
    <div id="meter"><i id="meterFill"></i></div>
    <div id="spinLbl">스핀</div>
    <div id="spin"><i id="spinDot"></i></div>
    <div id="opts">
    <div id="wbox" class="panel" hidden><span class="wt">공 무게</span><button id="wMinus" type="button" aria-label="공 더 가볍게">−</button><b id="wLbl">14lb</b><button id="wPlus" type="button" aria-label="공 더 무겁게">+</button><small id="wDesc"></small></div>
    <div id="spinBox" class="panel" hidden><span class="wt">스핀</span><button id="spL" type="button" aria-label="왼쪽으로 더 휘게">◀</button><input id="spinRange" type="range" min="-100" max="100" step="5" value="0" aria-label="스핀 (왼쪽 -, 오른쪽 +)"><button id="spR" type="button" aria-label="오른쪽으로 더 휘게">▶</button><b id="spinVal">없음</b></div>
    <div id="modeBox" class="panel" hidden><button id="btnMode" type="button">던지는 방식 바꾸기</button></div>
    </div>
    <div id="hint" class="panel" hidden></div>
    <div id="pad" hidden>
      <button id="btnBack" type="button" aria-label="이전 단계">뒤로</button>
      <button id="btnLeft" type="button" aria-label="왼쪽">◀</button>
      <button id="btnOk" type="button">확인</button>
      <button id="btnRight" type="button" aria-label="오른쪽">▶</button>
    </div>
  </footer>

  <section id="menu" class="overlay">
    <div class="card panel">
      <h1>기숙사 <span>볼링</span></h1>
      <p class="sub">방에서 즐기는 10프레임 볼링. 마우스나 손가락으로 스윙하세요.</p>
      <p class="lbl">인원</p>
      <div class="seg" id="segCount" role="group" aria-label="인원 선택">
        <button type="button" data-n="1" aria-pressed="true">1명</button>
        <button type="button" data-n="2" aria-pressed="false">2명</button>
        <button type="button" data-n="3" aria-pressed="false">3명</button>
        <button type="button" data-n="4" aria-pressed="false">4명</button>
      </div>
      <p class="lbl">공 무게 <span id="wMenuNote"></span></p>
      <div class="seg" id="segWeight" role="group" aria-label="공 무게 선택">
        <button type="button" data-lb="8" aria-pressed="false">8lb</button>
        <button type="button" data-lb="10" aria-pressed="false">10lb</button>
        <button type="button" data-lb="12" aria-pressed="false">12lb</button>
        <button type="button" data-lb="14" aria-pressed="true">14lb</button>
        <button type="button" data-lb="16" aria-pressed="false">16lb</button>
      </div>
      <div class="names" id="names"></div>
      <p class="lbl">던지는 방식</p>
      <div class="seg" id="segMode" role="group" aria-label="던지는 방식">
        <button type="button" data-mode="sling" aria-pressed="true">당겨서 놓기</button>
        <button type="button" data-mode="wii" aria-pressed="false">Wii식 스윙</button>
      </div>
      <ul class="steps" id="steps">
        <li><b>1 위치</b>◀ ▶ 로 서는 곳 선택</li>
        <li><b>2 조준</b>◀ ▶ 로 방향 선택</li>
        <li><b>3 스윙</b>당겼다가 휙, 옆으로 휘면 스핀</li>
      </ul>
      <button class="go" id="btnStart" type="button">게임 시작</button>
      <p class="best" id="best"></p>
    </div>
  </section>

  <section id="over" class="overlay" hidden>

<script>
/* Arcade bowling physics: 2D collisions on the lane plane + simple vertical/tumble state.
   Units: meters, seconds. +x right, -z toward the pins. Same file runs in Node (tests) and inline in the page. */
const BowlPhys = (function () {
  const LANE_HALF = 0.5334, GUT_CENTER = 0.65, WALL = 0.74, LANE_END = -19.45, BACK_WALL = -20.55;
  const HEAD_Z = -18.29, ROW_DZ = 0.2639, PIN_DX = 0.1524;
  const BALL_R = 0.109, PIN_COM = 0.15;
  const GUT_Y = -0.07, PIT_Y = -0.4;
  const TUNE = {
    ballMass: 6.5, pinMass: 1.5,
    pinRStand: 0.068, pinRFall: 0.09,
    eBallPin: 0.55, ePinPin: 0.6,
    fallSpeed: 0.8,
    standFric: 3.2, lyingFric: 4.5,
    hook: 1.6, rollDecel: 0.18,
    hopK: 0.2, jitter: 0.08,
  };

  // selectable ball weights (lb). Heavier: more pin action, a little slower, hooks less.
  const WEIGHTS = [8, 10, 12, 14, 16];
  function ballSpec(lb) {
    const t = Math.max(0, Math.min(1, (lb - 6) / 10));
    return { lb, kg: lb * 0.45359, speedK: 1.06 - 0.16 * t, hookK: 1.2 - 0.35 * t, carry: 0.72 + 0.6 * t };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const groundY = (x, z) => (z < LANE_END ? PIT_Y : (Math.abs(x) > LANE_HALF ? GUT_Y : 0));

  class Sim {
    constructor(seed) {
      this.rand = mulberry32(seed || 1);
      this.T = Object.assign({}, TUNE);
      this.pins = [];
      this.ball = null;
      this.time = 0;
      this.events = [];
      this.calmTime = 0;
      this.resetRack();
    }

    makePin(id, x, z) {
      return {
        id, x0: x, z0: z, x, z, vx: 0, vz: 0, y: 0, vy: 0,
        state: 'stand',           // stand | fall | down
        tilt: 0, tiltV: 0, dir: 0, yaw: this.rand() * 6.28, yawV: 0,
        wob: 0, wobT: 0, zone: 'lane', removed: false,
      };
    }

    resetRack() {
      const rows = [[0], [-1, 1], [-2, 0, 2], [-3, -1, 1, 3]];
      this.pins = [];
      let id = 1;
      rows.forEach((r, i) => r.forEach(k => this.pins.push(this.makePin(id++, k * PIN_DX, HEAD_Z - i * ROW_DZ))));
      this.ball = null; this.time = 0; this.calmTime = 0; this.events = [];
    }

    // keep only standing, un-removed pins (second ball of a frame)
    clearFallen() {
      this.pins = this.pins.filter(p => p.state === 'stand' && !p.removed);
      this.pins.forEach(p => { p.vx = p.vz = 0; p.wob = 0; p.tilt = 0; p.y = 0; p.vy = 0; });
      this.ball = null; this.time = 0; this.calmTime = 0; this.events = [];
    }

    standing() { return this.pins.filter(p => p.state === 'stand').map(p => p.id); }

    launch({ x, aim, speed, spin, mass, hookK, carry }) {
      this.ball = {
        x, z: 1.0, vx: Math.sin(aim) * speed, vz: -Math.cos(aim) * speed, y: BALL_R, vy: 0,
        zone: 'lane', spin: spin || 0, spinFast: speed, travelled: 0, done: false, hitAny: false,
        mass: mass || this.T.ballMass, hookK: hookK || 1, carry: carry || 1,
      };
      this.time = 0; this.calmTime = 0; this.events = [];
    }

    emit(type, a) { this.events.push({ type, a: a || 0 }); }

    // ---- collisions ------------------------------------------------------------------------
    pinRadius(p) { return p.state === 'stand' ? this.T.pinRStand : this.T.pinRFall; }
    collidable(p) {
      if (p.removed) return false;
      if (p.zone === 'pit' && p.y < -0.15) return false;
      if (p.state === 'down') return Math.hypot(p.vx, p.vz) > 0.3;
      return true;
    }

    hitPin(p, speedAfter, n, vrel) {
      if (p.state === 'stand' && speedAfter > this.T.fallSpeed) {
        p.state = 'fall';
        p.dir = Math.atan2(p.vz, p.vx);
        p.tiltV = Math.min(22, 4 + 1.15 * speedAfter) * (0.85 + 0.3 * this.rand());
        if (speedAfter > 2.2) p.vy = Math.min(3.2, this.T.hopK * speedAfter * (0.35 + 0.9 * this.rand()));
        p.yawV = (this.rand() - 0.5) * 2 * Math.min(14, 2 + speedAfter);
        this.emit('pin', Math.min(1, vrel / 8));
      } else if (p.state === 'stand') {
        p.wob = Math.min(0.28, speedAfter * 0.3 + 0.03); p.wobT = 0; p.dir = Math.atan2(p.vz, p.vx);
      } else {
        // already falling/down: re-kick
        if (p.state === 'down' && Math.hypot(p.vx, p.vz) > 0.5) { p.state = 'fall'; p.dir = Math.atan2(p.vz, p.vx); p.tiltV = 6; }
        this.emit('pin', Math.min(1, vrel / 10) * 0.7);
      }
    }

    collideBallPin(b, p) {
      const T = this.T;
      const dx = b.x - p.x, dz = b.z - p.z;
      const R = BALL_R + this.pinRadius(p);
      const d2 = dx * dx + dz * dz;
      if (d2 >= R * R || d2 < 1e-9) return;
      const d = Math.sqrt(d2);
      let nx = dx / d, nz = dz / d;
      const jb = (this.rand() - 0.5) * 2 * T.jitter, cb = Math.cos(jb), sb = Math.sin(jb);
      [nx, nz] = [nx * cb - nz * sb, nx * sb + nz * cb];
      const vrel = (b.vx - p.vx) * nx + (b.vz - p.vz) * nz;
      const pen = R - d;
      const mb = b.mass || T.ballMass, mp = T.pinMass, inv = 1 / mb + 1 / mp;
      // positional separation (pin takes most of it)
      p.x -= nx * pen * (mb / (mb + mp)); p.z -= nz * pen * (mb / (mb + mp));
      b.x += nx * pen * (mp / (mb + mp)); b.z += nz * pen * (mp / (mb + mp));
      if (vrel < 0) {
        const j = -(1 + T.eBallPin) * vrel / inv;
        b.vx += j / mb * nx; b.vz += j / mb * nz;
        p.vx -= j / mp * nx * (b.carry || 1); p.vz -= j / mp * nz * (b.carry || 1);
        b.hitAny = true;
        this.hitPin(p, Math.hypot(p.vx, p.vz), { x: nx, z: nz }, -vrel);
        this.emit('ball', Math.min(1, -vrel / 8));
      }
    }

    collidePinPin(a, c) {
      const T = this.T;
      const dx = a.x - c.x, dz = a.z - c.z;
      const R = this.pinRadius(a) + this.pinRadius(c);
      const d2 = dx * dx + dz * dz;
      if (d2 >= R * R || d2 < 1e-9) return;
      const d = Math.sqrt(d2);
      let nx = dx / d, nz = dz / d;
      const jp = (this.rand() - 0.5) * 2 * T.jitter * 1.5, cp = Math.cos(jp), sp2 = Math.sin(jp);
      [nx, nz] = [nx * cp - nz * sp2, nx * sp2 + nz * cp];
      const vrel = (a.vx - c.vx) * nx + (a.vz - c.vz) * nz;
      const pen = R - d;
      a.x += nx * pen * 0.5; a.z += nz * pen * 0.5; c.x -= nx * pen * 0.5; c.z -= nz * pen * 0.5;
      if (vrel < 0) {
        const j = -(1 + T.ePinPin) * vrel / (2 / T.pinMass);
        a.vx += j / T.pinMass * nx; a.vz += j / T.pinMass * nz;
        c.vx -= j / T.pinMass * nx; c.vz -= j / T.pinMass * nz;
        this.hitPin(a, Math.hypot(a.vx, a.vz), null, -vrel);
        this.hitPin(c, Math.hypot(c.vx, c.vz), null, -vrel);
      }
    }

    // ---- integration -----------------------------------------------------------------------
    stepBall(dt) {
      const b = this.ball, T = this.T;
      if (!b || b.done) return;
      const sp = Math.hypot(b.vx, b.vz);
      if (b.zone === 'lane') {
        if (b.z < -3 && b.z > LANE_END) {
          const prog = Math.min(1, (-b.z - 3) / 14);
          b.vx += T.hook * (b.hookK || 1) * b.spin * (0.12 + 0.88 * prog * prog) * Math.min(1, sp / 7) * dt;
        }
        const nsp = Math.max(0, sp - T.rollDecel * dt);
        if (sp > 0) { b.vx *= nsp / sp; b.vz *= nsp / sp; }
        b.x += b.vx * dt; b.z += b.vz * dt;
        if (b.z < 0 && Math.abs(b.x) > LANE_HALF + 0.01 && b.z > LANE_END) {
          b.zone = 'gutter'; this.emit('gutter', 1);
        }
      } else if (b.zone === 'gutter') {
        const tx = Math.sign(b.x) * GUT_CENTER;
        b.vx = (tx - b.x) * 9;
        b.x += b.vx * dt; b.z += b.vz * dt;
        b.vz *= (1 - 0.05 * dt);
        b.y = Math.max(GUT_Y + BALL_R, b.y - 3 * dt);
      }
      if (b.z < LANE_END && b.zone !== 'pit') { b.zone = 'pit'; this.emit('pit', 1); }
      if (b.zone === 'pit') {
        b.vy -= 9.8 * dt; b.y += b.vy * dt;
        if (b.y < PIT_Y + BALL_R) { b.y = PIT_Y + BALL_R; b.vy = 0; }
        b.x += b.vx * dt; b.z += b.vz * dt;
        b.vx *= 0.98; b.vz *= (1 - 2.2 * dt);
        if (b.z < BACK_WALL + BALL_R) { b.z = BACK_WALL + BALL_R; b.vz = 0; }
        if (Math.abs(b.x) > WALL - BALL_R) { b.x = Math.sign(b.x) * (WALL - BALL_R); b.vx = 0; }
        if (Math.hypot(b.vx, b.vz) < 0.2) b.done = true;
      }
      if (b.zone !== 'pit' && sp < 0.15 && b.z < -3) b.done = true;
    }

    stepPin(p, dt) {
      const T = this.T;
      if (p.removed) return;
      const sp = Math.hypot(p.vx, p.vz);
      const gy = groundY(p.x, p.z);
      const airborne = p.y > gy + 1e-4 || Math.abs(p.vy) > 1e-3;
      if (p.state === 'stand') {
        if (sp > 0) {
          const ns = Math.max(0, sp - T.standFric * dt);
          p.vx *= ns / sp; p.vz *= ns / sp;
        }
        p.x += p.vx * dt; p.z += p.vz * dt;
        if (p.wob > 0) { p.wobT += dt; p.wob = Math.max(0, p.wob - 0.35 * dt); }
      } else {
        p.x += p.vx * dt; p.z += p.vz * dt;
        if (airborne) {
          p.vy -= 9.8 * dt; p.y += p.vy * dt;
          p.tilt += p.tiltV * dt;
          if (p.y <= gy) {
            p.y = gy;
            if (p.vy < -1.4) { this.emit('land', Math.min(1, -p.vy / 6)); p.vy = -p.vy * 0.28; } else p.vy = 0;
          }
        } else if (sp > 0) {
          const ns = Math.max(0, sp - T.lyingFric * dt);
          p.vx *= ns / sp; p.vz *= ns / sp;
        }
        // grounded lying pin: settle tilt to a flat pose
        if (!airborne) {
          const target = Math.round((p.tilt - Math.PI / 2) / Math.PI) * Math.PI + Math.PI / 2;
          const diff = target - p.tilt;
          p.tilt += diff * Math.min(1, 14 * dt);
          p.tiltV *= 0.9;
          if (Math.abs(diff) < 0.03 && sp < 0.12 && Math.abs(p.vy) < 0.05) { p.state = 'down'; p.vx = p.vz = 0; p.tilt = target; }
        }
        p.yaw += p.yawV * dt; p.yawV *= (1 - 1.2 * dt);
      }
      // zones
      p.zone = p.z < LANE_END ? 'pit' : (Math.abs(p.x) > LANE_HALF ? 'gutter' : 'lane');
      if (p.zone !== 'pit' && !airborne && p.state !== 'stand' && p.y > gy) p.y = gy;
      if (p.zone !== 'lane' && p.state === 'stand') {
        // a standing pin pushed over an edge falls
        p.state = 'fall'; p.dir = Math.atan2(p.vz, p.vx); p.tiltV = 6;
      }
      // walls
      if (Math.abs(p.x) > WALL - 0.05) { p.x = Math.sign(p.x) * (WALL - 0.05); p.vx *= -0.3; }
      if (p.z < BACK_WALL + 0.1) { p.z = BACK_WALL + 0.1; p.vz *= -0.25; if (p.y > PIT_Y + 0.05) this.emit('wall', 0.5); }
      if (p.z > HEAD_Z + 1.2) { p.z = HEAD_Z + 1.2; p.vz = 0; }
    }

    step(dt) {
      const b = this.ball;
      this.time += dt;
      this.stepBall(dt);
      for (const p of this.pins) this.stepPin(p, dt);
      // collisions
      if (b && b.zone !== 'gutter') {
        for (const p of this.pins) if (this.collidable(p) && p.y < 0.35) this.collideBallPin(b, p);
      } else if (b && b.zone === 'gutter') {
        for (const p of this.pins) if (p.zone === 'gutter' && this.collidable(p)) this.collideBallPin(b, p);
      }
      const ps = this.pins;
      for (let i = 0; i < ps.length; i++) {
        if (!this.collidable(ps[i])) continue;
        for (let k = i + 1; k < ps.length; k++) {
          if (!this.collidable(ps[k])) continue;
          // ghost rule: two standing, non-moving pins never interact
          if (ps[i].state === 'stand' && ps[k].state === 'stand' && Math.hypot(ps[i].vx, ps[i].vz) < 0.01 && Math.hypot(ps[k].vx, ps[k].vz) < 0.01) continue;
          this.collidePinPin(ps[i], ps[k]);
        }
      }
      // settle detection
      let moving = 0;
      for (const p of this.pins) if (!p.removed && (p.state === 'fall' || Math.hypot(p.vx, p.vz) > 0.04)) moving = Math.max(moving, 1);
      const ballMoving = b && !b.done && b.z < 1;
      this.calmTime = (moving || ballMoving) ? 0 : this.calmTime + dt;
    }

    isSettled() { return this.ball && this.ball.z < -3.5 && this.calmTime > 0.7 && this.ball.done; }
    ballGone() { return this.ball && (this.ball.done || this.ball.zone === 'pit'); }
    fallenCount() { return this.pins.filter(p => p.state !== 'stand' && !p.removed).length; }
  }

  // Where a ball released with these settings will roll (no pins). Mirrors Sim.stepBall for the lane zone,
  // so the on-screen guide line matches the real throw. Returns [[x, z], ...] and whether it ends in a gutter.
  function previewPath({ x, aim, speed, spin, hookK }) {
    const pts = [[x, 1.0]];
    let px = x, pz = 1.0, vx = Math.sin(aim) * speed, vz = -Math.cos(aim) * speed, out = false;
    const dt = 1 / 120;
    for (let i = 0; i < 1600; i++) {
      const sp = Math.hypot(vx, vz);
      if (pz < -3 && pz > LANE_END) {
        const prog = Math.min(1, (-pz - 3) / 14);
        vx += TUNE.hook * (hookK || 1) * spin * (0.12 + 0.88 * prog * prog) * Math.min(1, sp / 7) * dt;
      }
      const nsp = Math.max(0, sp - TUNE.rollDecel * dt);
      if (sp > 0) { vx *= nsp / sp; vz *= nsp / sp; }
      px += vx * dt; pz += vz * dt;
      if (i % 4 === 3) pts.push([px, pz]);
      if (pz < 0 && Math.abs(px) > LANE_HALF + 0.01) { pts.push([px, pz]); out = true; break; }
      if (pz < HEAD_Z - 0.3 || nsp < 0.2) { pts.push([px, pz]); break; }
    }
    return { pts, out };
  }

  // convenience for tests: run a throw until settled
  function run(sim, throwParams, maxT) {
    sim.launch(throwParams);
    const dt = 1 / 240;
    let guard = 0;
    while (sim.time < (maxT || 12) && guard++ < 100000) {
      sim.step(dt);
      if (sim.ball && sim.ball.done && sim.calmTime > 0.7) break;
      if (sim.time > 3 && sim.calmTime > 1.5) break;
    }
    return sim;
  }

  return { Sim, run, TUNE, WEIGHTS, ballSpec, previewPath, LANE_HALF, GUT_CENTER, WALL, LANE_END, BACK_WALL, HEAD_Z, ROW_DZ, PIN_DX, BALL_R, PIN_COM, GUT_Y, PIT_Y, mulberry32, groundY };
})();

    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);

    pin(i) { if (!ctx) return; const n = performance.now(); if (n - lastPin < 22) return; lastPin = n;

/* ================================================================ scoring */
const mk = n => (n === 10 ? 'X' : n === 0 ? '-' : String(n));
function scoreCard(flat) {
  const frames = [], cum = [];
  let i = 0, total = 0, known = true;
  for (let f = 0; f < 10; f++) {
    const a = flat[i], b = flat[i + 1], c = flat[i + 2];
    let marks = [], val = null, used = 0;
    if (a === undefined) { frames.push([]); cum.push(null); known = false; continue; }
    if (f < 9) {
      if (a === 10) { marks = ['X']; used = 1; if (b !== undefined && c !== undefined) val = 10 + b + c; }
      else if (b === undefined) { marks = [mk(a)]; used = 1; }
      else if (a + b === 10) { marks = [mk(a), '/']; used = 2; if (c !== undefined) val = 10 + c; }
      else { marks = [mk(a), mk(b)]; used = 2; val = a + b; }
    } else {
      marks.push(mk(a));
      if (b !== undefined) marks.push(a === 10 ? mk(b) : (a + b === 10 ? '/' : mk(b)));
      if (c !== undefined) {
        if (a === 10 && b === 10) marks.push(mk(c));
        else if (a === 10) marks.push(b + c === 10 ? '/' : mk(c));
        else marks.push(mk(c));
      }
      const done = (a === 10 || a + (b || 0) === 10) ? c !== undefined : b !== undefined;
      if (done) val = a + (b || 0) + (c || 0);
      used = c !== undefined ? 3 : b !== undefined ? 2 : 1;
    }
    i += used;
    if (val !== null && known) { total += val; cum.push(total); } else { cum.push(null); known = false; }
    frames.push(marks);
  }
  const last = cum.filter(x => x !== null);
  return { frames, cum, total: last.length ? last[last.length - 1] : 0 };
}

      ? '카메라를 쓸 수 없어요. 권한을 허용했는지 확인하고, claude.ai 링크 대신 내 PC의 bowling.html 파일로 열어 보세요'

function camRangeSet(el, x) {

}
function camPress() {

  const rng = el && el.closest('input[type=range]');

  if (btn) { cam.ui = true; if (!btn.disabled) btn.click(); return; }

  cam.ax = cam.sx; cam.ay = cam.sy; cam.hx0 = cam.cx; cam.hy0 = cam.cy;

}
function camRelease() {

}
function camPower(p) { $('camPowFill').style.width = Math.round(clamp(p, 0, 1) * 100) + '%'; }
function camFeed(lm, now) {
  cam.lm = lm;
  if (!lm) {
    cam.hand = false;
    // the hand left the picture while pulling: a long enough pull counts as letting go, a short one is cancelled
    if (cam.down && now - cam.seen > 350) {
      const sl = S.sl;
      camEvent(sl && sl.mode === 'pull' && sl.power >= 0.35 ? 'pointerup' : 'pointercancel', cam.sx, cam.sy);
      cam.down = false; cam.pinch = false;
    }
    if (!cam.down) { cam.pinch = false; cam.closeCnt = cam.openCnt = 0; cam.ui = false; cam.range = null; }

    return;

  cam.hand = true; cam.seen = now;
  const asp = (camVideo.videoWidth || 640) / (camVideo.videoHeight || 480);
  const d = (a, b) => Math.hypot((lm[a].x - lm[b].x) * asp, lm[a].y - lm[b].y);
  const ratio = d(4, 8) / (d(0, 9) || 0.1);

  } else {
    cam.openCnt = ratio > 0.50 ? cam.openCnt + 1 : 0;

  const sl = S.sl, pulling = sl && sl.mode === 'pull' && sl.id === 999;
  const ht = pulling ? handThrow(sl, performance.now()) : null, pw = ht ? ht.power : 0;
  camPower(cam.pinch && cam.down ? pw : 0);
  camSay(!cam.pinch ? '엄지와 검지를 모으면 공을 잡아요'
    : pw > 0 ? `당김 ${Math.round(pw * 100)}%` + (Math.abs(ht.spin) > 0.1 ? ` · 스핀 ${ht.spin < 0 ? '왼쪽' : '오른쪽'}` : '') + ' · 손가락을 펴면 발사'

function drawCamMark(lm) {

}
function drawCamCursor() {
  if (!cam.on || !cam.hand) return;
  const sx = fxc.width / window.innerWidth, g = fxg, x = cam.sx * sx, y = cam.sy * sx;
  g.save(); g.lineWidth = 4 * sx;
  g.strokeStyle = cam.pinch ? '#ffc93c' : '#ffffff'; g.fillStyle = cam.pinch ? 'rgba(255,201,60,.55)' : 'rgba(255,255,255,.18)';

const camAllowed = (() => { const pp = document.permissionsPolicy || document.featurePolicy; try { return !pp || !pp.allowsFeature || pp.allowsFeature('camera'); } catch (_) { return true; } })();
$('btnCam').hidden = COARSE || !camAllowed || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
$('btnCam').addEventListener('click', () => { SFX.unlock(); if (cam.on) camStop(); else camStart(); });
$('camClose').addEventListener('click', () => camStop());

/* ================================================================ menu wiring */
function renderNames() {
  const box = $('names'); box.innerHTML = '';
  for (let i = 0; i < S.nCount; i++) {
    const l = document.createElement('label');
    l.innerHTML = `<i style="background:${PLAYER_CSS[i]}"></i><input id="pname${i}" type="text" maxlength="8" placeholder="플레이어 ${i + 1}" aria-label="플레이어 ${i + 1} 이름" autocomplete="off">`;
    box.appendChild(l);
  }
}
function startFromMenu() { startGame(S.nCount, Array.from({ length: S.nCount }, (_, i) => ($('pname' + i).value || '').trim())); }
$('segCount').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.nCount = +b.dataset.n;
  [...$('segCount').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));

});

  $('steps').innerHTML = S.mode === 'sling'
    ? '<li><b>1 옆으로 끌기</b>공 위치 정하기</li><li><b>2 아래로 당기기</b>방향과 세기</li><li><b>3 놓으면 발사</b>스핀은 슬라이더로</li>'
    : '<li><b>1 위치</b>◀ ▶ 로 서는 곳 선택</li><li><b>2 조준</b>◀ ▶ 로 방향 선택</li><li><b>3 스윙</b>당겼다가 휙, 옆으로 휘면 스핀</li>';
}
$('segMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.mode = b.dataset.mode; store.set('dormbowl.mode', S.mode); markModeMenu(); SFX.unlock(); SFX.click(); });
$('btnStart').addEventListener('click', () => { SFX.unlock(); startFromMenu(); });
$('btnAgain').addEventListener('click', () => { SFX.unlock(); startGame(S.players.length, S.players.map(p => p.name), S.players.map(p => p.lb)); });

$('wPlus').addEventListener('click', () => stepWeight(1));

$('segWeight').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.defaultLb = +b.dataset.lb; store.set('dormbowl.lb', String(S.defaultLb)); markWeightMenu(); SFX.unlock(); SFX.click(); });

requestAnimationFrame(frame);

// small handle for debugging / automated checks
window.__bowl = { S, scoreCard, doThrow, startGame, B, evaluateRoll, cam, camFeed };
